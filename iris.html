<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Monthsary, My Love</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,500&display=swap" rel="stylesheet">

<style>

:root{
    --bg:#faf8f4;
    --paper:#fffefb;
    --ink:#2b2622;
    --ink-soft:#6b6259;
    --line:#ddd6c9;
    --accent:#b3241c;
    --accent-dark:#7a1712;
    --accent-soft:#d99b93;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    overflow-x:hidden;
    background:var(--bg);
    color:var(--ink);
    font-family:"Inter",sans-serif;
}


.password-page{
    width:100%;
    min-height:100svh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:32px;
}

.password-content{
    width:min(88vw,340px);
    text-align:center;
}

.password-label{
    font-size:11px;
    letter-spacing:.14em;
    color:var(--ink-soft);
    margin-bottom:20px;
}

.password-content h1{
    font-family:"Playfair Display",serif;
    font-weight:500;
    font-size:clamp(28px,7vw,38px);
    line-height:1.25;
}

.password-content h1 em{
    font-style:italic;
    font-weight:500;
    color:var(--accent);
}

.hint{
    margin:26px 0 30px;
    font-size:13px;
    line-height:1.7;
    color:var(--ink-soft);
}

.hint strong{
    display:block;
    margin-top:6px;
    color:var(--ink);
    font-weight:500;
}

.password-input{
    width:min(70vw,200px);
    background:transparent;
    border:none;
    border-bottom:1px solid var(--line);
    outline:none;
    padding:10px 5px;
    text-align:center;
    color:var(--ink);
    font-family:"Playfair Display",serif;
    font-size:20px;
    letter-spacing:.4em;
    transition:border-color .25s ease;
}

.password-input:focus{
    border-color:var(--accent);
}

.password-input::placeholder{
    color:var(--line);
    letter-spacing:.4em;
}

.unlock-button{
    display:inline-block;
    margin-top:28px;
    padding:10px 4px;

    background:transparent;
    border:none;
    border-bottom:1px solid var(--ink);

    color:var(--ink);

    cursor:pointer;

    font-family:"Inter",sans-serif;
    font-size:12px;
    letter-spacing:.08em;

    transition:opacity .2s ease;
}

.unlock-button:hover{
    opacity:.6;
}

.unlock-button:active{
    transform:scale(.98);
}

#errorMessage{
    display:none;
    margin-top:16px;
    font-size:12px;
    color:var(--accent);
}

.shake{
    animation:shake .35s;
}

@keyframes shake{

    0%{
        transform:translateX(0);
    }

    25%{
        transform:translateX(-6px);
    }

    50%{
        transform:translateX(6px);
    }

    75%{
        transform:translateX(-6px);
    }

    100%{
        transform:translateX(0);
    }

}



.envelope-page{
    display:none;

    min-height:100svh;
    width:100%;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    padding:32px;
}

.envelope-heading{
    text-align:center;
    margin-bottom:44px;
}

.envelope-heading p{
    font-size:11px;
    letter-spacing:.14em;
    color:var(--ink-soft);
}

.envelope-heading h1{
    font-family:"Playfair Display",serif;

    font-style:italic;
    font-weight:500;

    font-size:34px;

    margin-top:8px;

    color:var(--accent);
}

.envelope-container{
    cursor:pointer;

    perspective:1000px;

    -webkit-tap-highlight-color:transparent;
}

.envelope{

    width:66vw;
    max-width:250px;

    height:44vw;
    max-height:168px;

    position:relative;

    filter:
        drop-shadow(
            0 10px 18px
            rgba(50,10,10,.18)
        );

}

.letter-preview{

    position:absolute;

    width:80%;
    height:86%;

    left:10%;
    bottom:4%;

    background:var(--paper);

    border:
        1px solid var(--line);

    z-index:1;

    display:flex;

    align-items:center;
    justify-content:center;

    box-shadow:
        0 4px 10px
        rgba(50,10,10,.12);

    transition:
        transform 1.1s ease;

}

.letter-preview::before{

    content:"♥";

    font-family:
        "Playfair Display",
        serif;

    font-size:20px;

    color:
        var(--accent-soft);

}

.envelope-front{

    position:absolute;

    inset:0;

    overflow:hidden;

    z-index:3;

    background:
        var(--paper);

    border:
        1px solid var(--line);

}

.left-fold{

    position:absolute;

    inset:0;

    background:
        linear-gradient(
            115deg,
            rgba(179,36,28,.06),
            transparent 55%
        );

    clip-path:
        polygon(
            0 0,
            50% 52%,
            0 100%
        );

}

.right-fold{

    position:absolute;

    inset:0;

    background:
        linear-gradient(
            245deg,
            rgba(179,36,28,.09),
            transparent 55%
        );

    clip-path:
        polygon(
            100% 0,
            50% 52%,
            100% 100%
        );

}

.bottom-fold{

    position:absolute;

    inset:0;

    background:
        linear-gradient(
            0deg,
            rgba(179,36,28,.05),
            transparent 45%
        );

    clip-path:
        polygon(
            0 100%,
            50% 46%,
            100% 100%
        );

}

.flap{

    position:absolute;

    top:0;
    left:0;

    width:100%;
    height:74%;

    background:
        linear-gradient(
            150deg,
            var(--accent) 0%,
            var(--accent-dark) 100%
        );

    clip-path:
        polygon(
            0 0,
            100% 0,
            50% 100%
        );

    transform-origin:
        top;

    transition:
        transform 1.05s ease;

    z-index:7;

}

.flap::before{

    content:"";

    position:absolute;

    inset:0;

    background:
        linear-gradient(
            200deg,
            rgba(255,255,255,.14),
            transparent 55%
        );

    clip-path:
        inherit;

}

.wax-seal{

    position:absolute;

    width:38px;
    height:38px;

    border-radius:50%;

    left:50%;
    top:60%;

    transform:
        translate(-50%,-50%);

    background:
        radial-gradient(
            circle at 35% 30%,
            #d1443a,
            var(--accent-dark)
        );

    display:flex;

    align-items:center;
    justify-content:center;

    color:#f4e2df;

    font-family:
        "Playfair Display",
        serif;

    font-size:16px;

    box-shadow:
        0 3px 6px
        rgba(40,5,5,.35),

        inset 0 1px 1px
        rgba(255,255,255,.25);

    border:
        1px solid rgba(0,0,0,.1);

    z-index:10;

    transition:
        opacity .4s ease,
        transform .4s ease;

}

.envelope.open .flap{

    transform:
        rotateX(180deg);

    z-index:0;

}

.envelope.open .letter-preview{

    transform:
        translateY(-52%);

}

.envelope.open .wax-seal{

    opacity:0;

    transform:
        translate(-50%,-50%)
        scale(0);

}

.tap-text{

    margin-top:38px;

    color:var(--ink-soft);

    font-size:11px;

    letter-spacing:.12em;

    animation:
        fade 2.2s infinite;

}

@keyframes fade{

    0%{
        opacity:.35;
    }

    50%{
        opacity:.9;
    }

    100%{
        opacity:.35;
    }

}



.letter-page{

    display:none;

    min-height:100svh;

    width:100%;

    padding:
        16px
        16px
        60px;

}

.letter-wrapper{

    width:
        min(94vw,460px);

    margin:auto;

}



.music-section{

    width:100%;

    margin:
        0 auto 20px;

    display:flex;

    justify-content:center;

    position:sticky;

    top:12px;

    z-index:100;

}

.music-player{

    width:100%;

    max-width:400px;

    display:flex;

    align-items:center;

    gap:14px;

    padding:
        12px 16px;

    border:
        1px solid var(--line);

    background:
        rgba(255,254,251,.96);

    box-shadow:
        0 6px 18px
        rgba(50,10,10,.10);

    backdrop-filter:
        blur(8px);

}


.record-cover{

    width:58px;
    height:58px;

    flex:none;

    border-radius:50%;

    position:relative;

    overflow:hidden;

    background:
        repeating-radial-gradient(
            circle,
            #1a1a1a 0px,
            #1a1a1a 2px,
            #252525 3px,
            #111 4px
        );

    box-shadow:
        0 3px 8px
        rgba(0,0,0,.25);

}


.record-cover img{

    position:absolute;

    width:32px;
    height:32px;

    border-radius:50%;

    object-fit:cover;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    z-index:2;

}



.record-cover::after{

    content:"";

    position:absolute;

    width:6px;
    height:6px;

    border-radius:50%;

    background:
        #f5f1eb;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    z-index:3;

}



.record-cover.playing{

    animation:
        spin 4s linear infinite;

}


@keyframes spin{

    from{

        transform:
            rotate(0deg);

    }

    to{

        transform:
            rotate(360deg);

    }

}




.music-info{

    flex:1;

    min-width:0;

}

.music-playing{

    font-size:9px;

    letter-spacing:.12em;

    color:
        var(--ink-soft);

    margin-bottom:4px;

}

.music-song{

    font-family:
        "Playfair Display",
        serif;

    font-size:15px;

    line-height:1.2;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

}

.music-artist{

    margin-top:3px;

    font-size:11px;

    color:
        var(--ink-soft);

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

}


.music-controls{

    display:flex;

    align-items:center;

    gap:7px;

    flex:none;

}

.music-controls button{

    border:none;

    background:
        transparent;

    color:
        var(--ink);

    cursor:pointer;

    font-size:12px;

    padding:4px;

    font-family:
        "Inter",
        sans-serif;

}

.play-button{

    width:28px;
    height:28px;

    border-radius:50%;

    border:
        1px solid var(--ink)
        !important;

    display:flex;

    align-items:center;
    justify-content:center;

}

.song-counter{

    font-size:9px;

    color:
        var(--ink-soft);

    letter-spacing:.06em;

}

.paper{

    position:relative;

    width:100%;

    background:
        var(--paper);

    border:
        1px solid var(--line);

    padding:
        44px 8%;

}

.letter-title{

    margin-bottom:32px;

}

.letter-title h1{

    font-family:
        "Playfair Display",
        serif;

    font-weight:500;

    font-size:22px;

    letter-spacing:.02em;

    line-height:1.3;

}

.letter-image{

    display:block;

    width:100%;

    max-height:220px;

    object-fit:cover;

    margin:
        0 0 30px;

}

.dear{

    margin-bottom:20px;

    font-family:
        "Playfair Display",
        serif;

    font-style:italic;

    font-size:17px;

    color:
        var(--accent);

}

.letter-content{

    color:
        var(--ink);

    font-size:14.5px;

    line-height:1.85;

}

#typedText{

    white-space:
        pre-wrap;

}

.from-section{

    text-align:right;

    margin-top:40px;

}

.from-section span{

    display:block;

    font-size:9px;

    letter-spacing:.12em;

    color:
        var(--ink-soft);

}

.from-section strong{

    display:block;

    margin-top:6px;

    font-family:
        "Playfair Display",
        serif;

    font-style:italic;

    font-weight:500;

    font-size:20px;

    color:
        var(--accent);

}

.ending{

    margin-top:36px;

    padding-top:24px;

    border-top:
        1px solid var(--line);

    text-align:center;

}

.ending p{

    font-family:
        "Playfair Display",
        serif;

    font-style:italic;

    font-size:15px;

    color:
        var(--ink-soft);

}

.ending h2{

    font-family:
        "Playfair Display",
        serif;

    font-style:italic;

    font-weight:500;

    font-size:22px;

    margin-top:6px;

    color:
        var(--accent);

}


@media(max-width:380px){

    .paper{

        padding:
            36px 7%;

    }

    .letter-title h1{

        font-size:20px;

    }

    .letter-content{

        font-size:14px;

    }

    .music-player{

        gap:9px;

        padding:
            10px 12px;

    }

    .record-cover{

        width:50px;
        height:50px;

    }

    .record-cover img{

        width:27px;
        height:27px;

    }

}

</style>

</head>


<body>


<!-- =========================
     PASSWORD PAGE
========================= -->

<section
    class="password-page"
    id="passwordPage"
>

    <div
        class="password-content"
        id="passwordContent"
    >

        <div class="password-label">

            MADE JUST FOR YOU

        </div>


        <h1>

            For my love,
            <em>always</em>

        </h1>


        <div class="hint">

            <strong>

                Hint: The day we made it official

            </strong>

        </div>


        <input

            class="password-input"

            type="password"

            id="passwordInput"

            maxlength="4"

            inputmode="numeric"

            placeholder="••••"

        >


        <br>


        <button
            class="unlock-button"
            onclick="checkPassword()"
        >

        </button>

    </div>

</section>



<!-- =========================
     ENVELOPE PAGE
========================= -->

<section
    class="envelope-page"
    id="envelopePage"
>


    <div class="envelope-heading">

        <p>

            A LITTLE SOMETHING FOR YOU

        </p>


        <h1>

            My Love

        </h1>

    </div>



    <div
        class="envelope-container"
        id="envelopeContainer"
    >

        <div
            class="envelope"
            id="envelope"
        >

            <div
                class="letter-preview"
            ></div>


            <div
                class="envelope-front"
            >

                <div
                    class="left-fold"

                <div

                ></div>


                <div
                    class="bottom-fold"

            </div>

            ></div>

            >

            </div>

    </div>

        TAP TO OPEN

    </p>


</section>



<!-- =========================
     LETTER PAGE
========================= -->

<section
    class="letter-page"
    id="letterPage"
>


    <div class="letter-wrapper">



        <!-- MUSIC PLAYER -->

        <div class="music-section">


            <div class="music-player">


                <!-- VINYL DISC -->

                <div
                    class="record-cover"
                    id="recordCover"
                >

                    <img

                        id="recordImage"

                        src="YOUR-COVER-1.jpg"

                        alt="Song Cover"

                    >

                </div>



                <!-- MUSIC INFO -->

                <div class="music-info">


                    <div
                        class="music-playing"
                    >

                        NOW PLAYING

                    </div>

                        id="songName"

                    >

                        Your Song Name

                    </div>

                        class="music-artist"

                        id="artistName"

                    >

                    </div>

                <div class="music-controls">


                    <button
                        id="previousButton"

                    </button>

                    >

                    </button>

                        id="nextButton"

                    >

                    </span>


                </div>

                id="music"

        </div>



        <!-- =========================
             LETTER PAPER
        ========================= -->


        <div class="paper">


            <div class="letter-title">

                    A Letter From My Heart

                </h1>

                <div

<script>



function checkPassword(){


    const input =
        document.getElementById(
            "passwordInput"
        );


    const content =
        document.getElementById(
            "passwordContent"
        );


    const error =
        document.getElementById(
            "errorMessage"
        );



    if(input.value === "0808"){


        document.getElementById(
            "passwordPage"
        ).style.display = "none";


        document.getElementById(
            "envelopePage"
        ).style.display = "flex";


    }


    else{


        error.style.display =
            "block";


        content.classList.add(
            "shake"
        );


        input.value = "";


        setTimeout(function(){


            content.classList.remove(
                "shake"
            );


        },350);


    }


}



document
.getElementById("passwordInput")
.addEventListener(
    "keydown",
    function(event){


        if(event.key === "Enter"){


            checkPassword();


        }


    }
);




const envelopeContainer =
    document.getElementById(
        "envelopeContainer"
    );


const envelope =
    document.getElementById(
        "envelope"
    );


const envelopePage =
    document.getElementById(
        "envelopePage"
    );


const letterPage =
    document.getElementById(
        "letterPage"
    );


const typedText =
    document.getElementById(
        "typedText"
    );


let opened = false;




const letter = `Hello, my love. Surprise, I guess?

Well, hindi ko alam kung saan ako magsisimula because I have a lot of things I want to tell you. As in sobrang dami, and, I don't think words will ever be enough to explain how much you mean to me. But I still wanted to write this letter for you, especially because today, we're celebrating something very special—our first official monthsary.

Time really goes by fast, doesn't it? Parang kailan lang, we were just friends, talking and getting to know each other. We had random conversations, shared different things about ourselves, and slowly became more comfortable with each other. Who would've thought na aabot tayo sa ganito? From being friends, to slowly developing feelings and having crushes on each other, and now, here we are, celebrating our first official monthsary.

Honestly, when I think about it, medyo nakakatuwa at nakakakilig. I never expected that things would turn out this way, but I'm really glad they did. Out of all the possibilities, somehow, we found our way to each other.

To be honest, it's my first time feeling this way. Like, I can genuinely be myself when I'm with you. I don't feel like I have to pretend or change anything about myself just to be accepted. I can be makulit, weird, random, quiet, or even moody sometimes, and you still accept me for who I am.

You always try to understand me, and sobrang haba ng pasensya mo sa akin. Kahit na there are times na gusto kong mapag-isa or hindi mo ako makausap nang maayos because something happened, you never make me feel bad about it. Instead, you try to understand where I'm coming from. You give me the space and time I need without making me feel guilty for needing it.

I really appreciate that about you. You don't force me to talk when I'm not ready, but you still make sure that I know you're there. And honestly, that means a lot to me. Thank you for being patient with me, especially during the times when I'm difficult to understand. Thank you for staying gentle and for trying to understand the parts of me that I sometimes don't even know how to explain.

You make me feel safe and comfortable in a way that I never expected.

I also love how you always sakay sa mga trip ko, especially when it comes to games. I know you're not really the type of person na mahilig maglaro, especially games like CODM, but you still play and try to learn because of me, hehe. I find that really cute and sweet. You don't have to love everything that I love, but the fact that you're willing to try something because you know I enjoy it means a lot to me.

You also remember the things I love, even the little things. Like dinosaurs. I know I sometimes yap a lot about dinosaurs and share random facts that probably aren't interesting to everyone, but you still listen to me. You let me talk about the things I'm passionate about, and you never make me feel like I'm talking too much. Those little things mean more to me than you probably realize. It's comforting to have someone who listens to you and genuinely wants to know more about the things you like.

Thank you, baby, for everything. Thank you for making me feel loved, appreciated, and understood. I appreciate every little thing you do, even the things you probably don't think are a big deal. Thank you for being patient with me, for making time for me despite being busy, and for simply being there.

I hope you always remember how much I appreciate you. Even on the days when you feel like you're not doing enough, please know that just being you is already enough for me.

I love you for who you are. I love your personality, your little habits, the way you react to things, and all the little things that make you, you. I hope you never feel like you have to change yourself just to be loved, because I love you exactly as you are.
This is only our first official monthsary, and I know we still have a lot ahead of us. Things won't always be easy, and there may be misunderstandings or difficult days, but I hope we'll always choose to understand each other and work through things together.

Thank you for becoming my girlfriend and for letting me be part of your life. I'm genuinely happy that it's you.

Happy first official monthsary, my love. One month pa lang tayo officially, and I’m already excited for all the moments na makakasama pa kita. More random talks, kulitan, at syempre, more memories na tayo lang ang makakaintindi at makakaalala.

I love you, baby! `;




envelopeContainer.addEventListener(
    "click",
    function(){


        if(opened){

            return;

        }


        opened = true;


        envelope.classList.add(
            "open"
        );



        setTimeout(function(){


            envelopePage.style.display =
                "none";


            letterPage.style.display =
                "block";


            window.scrollTo(0,0);


            typedText.textContent =
                letter;


        },1400);


    }
);




const music =
    document.getElementById(
        "music"
    );


const playButton =
    document.getElementById(
        "playButton"
    );


const previousButton =
    document.getElementById(
        "previousButton"
    );


const nextButton =
    document.getElementById(
        "nextButton"
    );


const recordCover =
    document.getElementById(
        "recordCover"
    );


const recordImage =
    document.getElementById(
        "recordImage"
    );


const songName =
    document.getElementById(
        "songName"
    );


const artistName =
    document.getElementById(
        "artistName"
    );


const songCounter =
    document.getElementById(
        "songCounter"
    );




const playlist = [


    {

        title:
            "Minamahal",

        artist:
            "Earl Agustin",

        audio:
            "YOUR-SONG-1.mp3",

        cover:
            "YOUR-COVER-1.jpg"

    },


    {

        title:
            "I Like Me Better",

        artist:
            "Lauv",

        audio:
            "YOUR-SONG-2.mp3",

        cover:
            "YOUR-COVER-2.jpg"

    },


    {

        title:
            "Tahanan",

        artist:
            "Adie",

        audio:
            "YOUR-SONG-3.mp3",

        cover:
            "YOUR-COVER-3.jpg"

    }


];


let currentSong = 0;


function loadSong(index){


    const song =
        playlist[index];



    music.src =
        song.audio;



    songName.textContent =
        song.title;



    artistName.textContent =
        song.artist;



    recordImage.src =
        song.cover;



    songCounter.textContent =
        (index + 1)
        + "/"
        + playlist.length;


}





function playMusic(){


    music.play();


    playButton.textContent =
        "❚❚";


    recordCover.classList.add(
        "playing"
    );


}



function pauseMusic(){


    music.pause();


    playButton.textContent =
        "▶";


    recordCover.classList.remove(
        "playing"
    );


}



playButton.addEventListener(
    "click",
    function(){


        if(music.paused){


            playMusic();


        }


        else{


            pauseMusic();


        }


    }
);



nextButton.addEventListener(
    "click",
    function(){


        currentSong++;



        if(
            currentSong
            >=
            playlist.length
        ){


            currentSong = 0;


        }



        loadSong(
            currentSong
        );


        playMusic();


    }
);



previousButton.addEventListener(
    "click",
    function(){


        currentSong--;



        if(currentSong < 0){


            currentSong =
                playlist.length - 1;


        }



        loadSong(
            currentSong
        );


        playMusic();


    }
);



music.addEventListener(
    "ended",
    function(){


        currentSong++;



        if(
            currentSong
            >=
            playlist.length
        ){


            currentSong = 0;


        }



        loadSong(
            currentSong
        );


        playMusic();


    }
);






loadSong(
    currentSong
);


</script>


</body>
